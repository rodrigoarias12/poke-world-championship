<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120d1c">
  <meta name="description" content="Poké World Championship: combates Pokémon en la arena acuática. Arma tu equipo y gana el campeonato mundial.">
  <title>Poké World Championship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #120d1c;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #2a1f3d 0%, #120d1c 70%);
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      -webkit-touch-callout: none;
    }
    /* Celular en vertical: pedir que lo giren */
    #girar {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #16294f;
      color: #ffe66b;
      font: 900 24px Rubik, system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    #girar .tel {
      width: 54px;
      height: 92px;
      border: 5px solid #f4f1ea;
      border-radius: 12px;
      animation: girar 1.6s ease-in-out infinite;
    }
    #girar small { color: #f4f1ea; font-weight: 700; font-size: 16px; }
    @keyframes girar {
      0%, 25% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #girar { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Poké World Championship"></canvas>
  <div id="girar" role="alert">
    <div class="tel"></div>
    <div>Gira el teléfono</div>
    <small>El juego se ve en horizontal</small>
  </div>
  <script type="module" src="src/main.js"></script>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
