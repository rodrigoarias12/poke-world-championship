<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120d1c">
  <meta name="description" content="Poké World Championship: combates Pokémon en la arena acuática. Arma tu equipo y gana el campeonato mundial.">
  <title>Poké World Championship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #120d1c;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #2a1f3d 0%, #120d1c 70%);
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Poké World Championship"></canvas>
  <script type="module" src="src/main.js"></script>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
